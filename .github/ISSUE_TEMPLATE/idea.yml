name: Idea
description: Suggest a feature or an improvement
title: "[Idea] "
labels: ["feedback", "idea", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: "This issue is public. Don't include passwords, tokens or your customers' private data."
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem or the job you want done, not the solution yet.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Your suggestion
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Examples, screenshots, other tools that do this well.
